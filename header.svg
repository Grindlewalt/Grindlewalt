<svg xmlns="http://www.w3.org/2000/svg" width="636" height="388" viewBox="0 0 636 388" role="img" aria-label="Grant Rindal, software lead FRC 4911 CyberKnights">
  <style>
    .ln, .sub { font-family:"DejaVu Sans Mono","Cascadia Mono",Consolas,Menlo,monospace; }
